<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the safe-area insets below actually apply on notched phones -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<title>HokieDay</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --ink:#e9edf3; --dim:#98a2b3;
  --line:#2a3040; --accent:#e87722; --maroon:#861f41; --ok:#3fb950; --warn:#d29922;
  --pad:16px;
  --tap:48px;                    /* min touch target; thumbs, not cursors */
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;
  padding-bottom:calc(206px + var(--safe-b));   /* room for the sticky ask bar */
}
.shell{max-width:720px;margin:0 auto;padding:calc(var(--pad) + var(--safe-t)) var(--pad) 0}

/* ---------- header ---------- */
header{position:relative}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.tag{color:var(--dim);font-size:13px;margin:2px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;color:var(--dim);border:1px solid var(--line);
      background:var(--card2);border-radius:999px;padding:5px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#24502f}
.chip.warn{color:var(--warn);border-color:#544216}

/* ---------- answer ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:14px 15px;margin:0 0 12px}
.k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px}
.answer{font-size:17px;line-height:1.45}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.metric{font-size:12px;color:var(--dim);border:1px solid var(--line);
        border-radius:8px;padding:3px 8px}

/* ---------- re-plan banner: the money moment ---------- */
.banner{border:1px solid #6b4a22;background:linear-gradient(180deg,#2a1d10,#221809);
        border-radius:16px;padding:14px 15px;margin:0 0 12px}
.banner .head{display:flex;align-items:center;gap:8px;font-weight:650;
              color:var(--accent);font-size:15px;margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
     box-shadow:0 0 0 4px rgba(232,119,34,.18)}
.why{font-size:14.5px;color:#f0d9c4}
.why b{color:#fff}
.banner .foot{font-size:12.5px;color:var(--dim);margin-top:8px}

/* ---------- itineraries ---------- */
.plan{border-radius:16px;padding:13px 14px;margin:0 0 12px;border:1px solid var(--line);
      background:var(--card)}
.plan.chosen{border-color:#2f6b3c;background:#141a16}
.plan.invalid{opacity:.72;border-style:dashed}
.plan .title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan .badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);
             color:var(--dim)}
.plan.chosen .badge{color:#7ee08f;border-color:#2f6b3c}
.plan.invalid .badge{color:#e0a1a1;border-color:#5b2a2a}
.times{font-size:19px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.times small{font-size:13px;color:var(--dim);display:block;margin-top:2px}

.leg{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;
     padding:10px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:none}
.leg .ic{font-size:15px;line-height:1.35;text-align:center}
.leg .what{font-size:15px}
.leg .sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.leg .mins{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;
      padding:1px 6px;margin-top:4px;color:var(--dim)}
.ptag.sched{color:#7cc4ff;border-color:#274763}
.ptag.est{color:var(--warn);border-color:#544216}
.ptag.safe{color:var(--ok);border-color:#24502f}

/* ---------- sticky ask bar (thumb zone) ---------- */
.ask{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:linear-gradient(180deg,rgba(15,17,21,.86),rgba(15,17,21,.98));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:10px var(--pad) calc(10px + var(--safe-b));
}
.ask .inner{max-width:720px;margin:0 auto}
.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:9px;-webkit-overflow-scrolling:touch;
      scrollbar-width:none}
.scen::-webkit-scrollbar{display:none}
.scen button{flex:0 0 auto;font:15px/1.2 inherit;min-height:40px;padding:9px 13px;
             border-radius:999px;border:1px solid var(--line);background:var(--card2);
             color:var(--ink);white-space:nowrap}
.scen button.hot{border-color:var(--maroon);background:#2a1620}
.scen button:active{transform:scale(.98)}
.inputrow{display:flex;gap:8px}
input[type=text]{
  flex:1;min-width:0;font:16px inherit;   /* 16px: anything smaller makes iOS zoom on focus */
  min-height:var(--tap);padding:12px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.send{min-height:var(--tap);padding:0 20px;border-radius:14px;border:1px solid var(--maroon);
      background:#2a1620;color:var(--ink);font:16px inherit;font-weight:600}
.send:active{transform:scale(.98)}

/* location row: thumb-reachable, with a fallback when GPS is unavailable */
.locrow{display:flex;gap:8px;align-items:center;padding-top:8px}
.locbtn{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
        background:var(--card2);color:var(--ink);font:14px inherit;white-space:nowrap}
.locbtn.on{border-color:var(--ok);color:var(--ok)}
.locbtn.warn{border-color:var(--warn);color:var(--warn)}
.locrow select{flex:1;min-width:0;min-height:40px;font:14px inherit;border-radius:999px;
        border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:0 10px}
.origin-note{font-size:12.5px;color:var(--warn);margin-top:6px}

/* map: an inline SVG drawn from OUR GTFS geometry, so it works offline */
.mapwrap{background:#12151b;border:1px solid var(--line);border-radius:16px;
         overflow:hidden;margin:0 0 12px}
.mapwrap svg{display:block;width:100%;height:auto}
.links{display:flex;flex-wrap:wrap;gap:8px}
.maplink{display:inline-block;min-height:40px;line-height:40px;padding:0 14px;
         border-radius:999px;border:1px solid var(--line);background:var(--card2);
         color:var(--ink);text-decoration:none;font-size:14px}
.maplink:active{transform:scale(.98)}

details{margin-top:4px}
summary{color:var(--dim);font-size:13px;cursor:pointer;list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:" "}
details[open] summary::before{content:" "}
.notes{color:var(--dim);font-size:12.5px;padding:2px 0 10px}
.notes code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.err{color:#ff7b72}
.muted{color:var(--dim);font-size:13px}

/* ---------- wider screens: laptop demo ---------- */
@media (min-width:760px){
  .shell{max-width:1000px;padding-top:28px}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  body{padding-bottom:188px}
  .ask .inner{max-width:1000px}
}
/* respect users who ask for less motion */
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Hokie<span>Day</span></h1>
    <div class="tag">One question across dining, transit and hours — and it re-plans when reality moves.</div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="out"></main>
  <details id="notes">
    <summary>assumptions, provenance and limits</summary>
    <div class="notes" id="notesBody"></div>
  </details>
</div>

<div class="ask">
  <div class="inner">
    <div class="scen" id="scen"></div>
    <div class="inputrow">
      <input type="text" id="q" inputmode="text" enterkeyhint="send"
             placeholder="Ask in your own words…">
      <button class="send" onclick="ask()">Ask</button>
    </div>
    <div class="locrow">
      <button class="locbtn" id="locbtn" onclick="useLocation()">📍 Use my location</button>
      <select id="from" aria-label="starting point"></select>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON = {walk:"🚶", bus:"🚌", eat:"🍽️"};
const hhmm = s => (s || "").slice(11,16);

// Device position (when the browser will give one) and the fallback origin.
// Geolocation requires a SECURE CONTEXT: it works on localhost and over HTTPS,
// but NOT over plain-HTTP LAN, which is why the picker exists as a fallback.
let ORIGIN = null;              // {lat, lon, accuracy}
let FROM_PLACE = "auto";

function useLocation(){
  const b = $("#locbtn");
  if(!navigator.geolocation){ b.className = "locbtn warn"; b.textContent = "no geolocation here"; return; }
  if(!window.isSecureContext){
    b.className = "locbtn warn";
    b.textContent = "📍 needs https or localhost";
    return;
  }
  b.className = "locbtn"; b.textContent = "locating…";
  navigator.geolocation.getCurrentPosition(
    p => {
      ORIGIN = {lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy};
      b.className = "locbtn on";
      b.textContent = "📍 ±" + Math.round(p.coords.accuracy) + " m";
      ask();
    },
    err => {
      b.className = "locbtn warn";
      b.textContent = "📍 " + (err.code === 1 ? "permission denied"
                                             : (err.message || "unavailable"));
    },
    {enableHighAccuracy:true, timeout:8000, maximumAge:30000}
  );
}

function provenance(l){
  if(l.type === "bus")  return '<div class="ptag sched">scheduled · service-filtered</div>';
  if(l.type === "walk") return '<div class="ptag est">estimated · straight-line × factor</div>';
  if(l.type === "eat"){
    let t = '<div class="ptag sched">from the menu API</div>';
    if(l.allergens_known === false && l.venue_allergen_free)
      t += '<div class="ptag safe">documented allergen-free kitchen</div>';
    else if(l.allergens_known === false)
      t += '<div class="ptag est">allergens UNKNOWN</div>';
    return t;
  }
  return "";
}

function leg(l){
  const what = l.place
    ? `${esc(l.place)}${l.item ? ` — <b>${esc(l.item)}</b>` : ""}`
    : `${esc(l.from)} → ${esc(l.to)}`;
  const sub = l.type === "bus"
      ? `route ${esc(l.route_id)} · wait ${esc(l.wait_min)} min`
      : (l.item && l.kcal != null ? `${esc(l.kcal)} kcal` : "");
  return `<div class="leg">
    <div class="ic">${ICON[l.type] || "•"}</div>
    <div><div class="what">${what}</div>${sub ? `<div class="sub">${sub}</div>` : ""}${provenance(l)}</div>
    <div class="mins">${esc(l.minutes)} min</div>
  </div>`;
}

function plan(it, title, state){
  if(!it) return "";
  return `<section class="plan ${state}">
    <div class="title"><span class="k" style="margin:0">${esc(title)}</span>
      <span class="badge">${it.used_bus ? "bus" : "walk"}</span></div>
    <div class="times">${hhmm(it.leave_time)} → ${hhmm(it.arrive_time)}
      <small>${esc(it.total_min)} min · slack ${esc(it.slack_min)} min${
        it.arrives_in_window ? "" : " · MISSES THE WINDOW"}</small></div>
    ${(it.legs||[]).map(leg).join("")}
  </section>`;
}

function render(r){
  if(r.error){ $("#out").innerHTML = `<div class="card err">Error: ${esc(r.error)}</div>`; return; }
  const it = r.itinerary, trg = r.replan_trigger;
  const og = r._origin || {};
  const where = og.source === "device"
      ? `from your location${og.accuracy_m ? " ±" + Math.round(og.accuracy_m) + " m" : ""}`
      : (og.label ? `from ${og.label}` : "from the default origin");
  let h = "";

  h += `<div class="card"><div class="k">answer</div>
     <div class="answer">${esc(r.rationale)}</div>
     <div class="pill-row">
       <span class="metric">${esc(where)}</span>
       <span class="metric">profile ${esc(r.student_ref)}</span>
       <span class="metric">${esc((r._request||{}).start)}–${esc((r._request||{}).end)}</span>
     </div>
     ${og.note ? `<div class="origin-note">⚠ ${esc(og.note)}</div>` : ""}</div>`;

  const planA = (r.alternatives||[]).find(a => a.type === "previous_itinerary_a");

  if(r._map_svg){
    h += `<div class="mapwrap">${r._map_svg}</div>`;
  } else if(r._map_error){
    h += `<div class="card err">map unavailable: ${esc(r._map_error)}</div>`;
  }

  if(trg){
    h += `<div class="banner">
      <div class="head"><span class="dot"></span>RE-PLANNED — ${esc(trg.cause)}</div>
      <div class="why">${esc(trg.detail)}</div>
      <div class="foot">Plan A was built, then live state was re-checked and invalidated it.
        Both plans are below so the change is inspectable, not asserted.</div>
    </div>`;
  }

  h += `<div class="plans">
      ${planA ? plan(planA.itinerary, "PLAN A — invalidated", "invalid") : ""}
      ${plan(it, planA ? "PLAN B — what we recommend" : "PLAN", "chosen")}
    </div>`;

  const walk = (r.alternatives||[]).find(a => a.type === "walk_direct");
  if(walk){
    h += `<div class="card"><div class="k">alternative</div>
      <div>Walk the whole way: <b>${esc(walk.minutes)} min</b>
        <span class="muted">(${esc(walk.meters)} m straight-line)</span></div></div>`;
  }

  if((r._links||[]).length){
    h += `<div class="card"><div class="k">navigate it</div>
      <div class="links">` +
      r._links.map(l => `<a class="maplink" href="${esc(l.url)}" target="_blank"
         rel="noopener">${esc(l.label)} · ${esc(l.app)}</a>`).join("") +
      `</div><div class="muted" style="margin-top:10px">Opens your maps app for
        turn-by-turn. We plan the trip; the maps app navigates it. No API key needed.</div></div>`;
  }
  $("#out").innerHTML = h;
}

async function ask(id){
  const body = id ? {scenario_id:id} : {text:$("#q").value};
  body.from_place = FROM_PLACE;
  if(ORIGIN){ body.lat = ORIGIN.lat; body.lon = ORIGIN.lon; body.accuracy = ORIGIN.accuracy; }
  if(id) $("#q").value = "";
  $("#out").innerHTML = '<div class="card muted">planning…</div>';
  try{
    const res = await fetch("/api/ask", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    render(await res.json());
    $("#out").scrollIntoView({block:"start", behavior:"smooth"});
  }catch(e){
    $("#out").innerHTML = `<div class="card err">request failed: ${esc(e)}</div>`;
  }
}

async function boot(){
  try{
    const s = await (await fetch("/api/status")).json();
    $("#chips").innerHTML =
      `<span class="chip ${s.offline?"ok":""}">${s.offline?"OFFLINE · frozen snapshot":"MODE "+s.mode}</span>
       <span class="chip">now ${esc(s.campus_now)}</span>
       <span class="chip">${esc(s.live_vehicles)} live buses</span>
       <span class="chip ${s.live_stale?"warn":""}">${esc(s.fixtures)} fixtures</span>`;
    $("#notesBody").innerHTML =
      s.caveats.map(c => "• " + esc(c)).join("<br>") +
      `<div style="margin-top:10px">assumed constants: eat ${esc(s.assumptions.eat_minutes)} min ·
        boarding buffer ${esc(s.assumptions.min_board_buffer_min)} min ·
        walk ${esc(s.assumptions.walk_speed_mps)} m/s × ${esc(s.assumptions.walk_path_factor)} ·
        bus "full" at ${esc(s.assumptions.bus_full_pct)}%</div>
       <div style="margin-top:8px">meal choice: ${esc(s.assumptions.meal_ranking)}
        — a demo convenience, not dietary advice.</div>
       <div style="margin-top:8px">The map is drawn from the GTFS shape geometry we ingested — no basemap, no
        tiles, no API key, and it renders with networking off. Dashed lines are straight-line walk
        estimates, because that is what our walk model actually computes.</div>
       <div style="margin-top:8px">The text box uses a small rule-based parser offline; with a
        Databricks workspace the text→parameters step is the agent's job, calling these same
        tools as governed Unity Catalog functions.</div>`;

    const sc = await (await fetch("/api/scenarios")).json();
    $("#scen").innerHTML = sc.map((x,i) =>
      `<button class="${i===1?"hot":""}" onclick="ask('${esc(x.id)}')">${esc(x.label)}</button>`).join("");

    try{
      const os = await (await fetch("/api/origins")).json();
      const sel = $("#from");
      sel.innerHTML = '<option value="auto">default origin</option>' +
        os.map(o => `<option value="${esc(o.key)}">${esc(o.key)}${o.verified ? " ✓" : ""}</option>`).join("");
      sel.onchange = () => { FROM_PLACE = sel.value; ORIGIN = null;
        $("#locbtn").className = "locbtn"; $("#locbtn").textContent = "📍 Use my location"; ask(); };
    }catch(e){ /* picker is optional */ }
  }catch(e){
    $("#chips").innerHTML = `<span class="chip warn">status unavailable</span>`;
  }
  ask("eat");
}
$("#q").addEventListener("keydown", e => { if(e.key === "Enter") ask(); });
boot();
</script>
</body>
</html>
